<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 영화 포토티켓</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff5f5;--tx:#231f20;--mut:#6f6a6b;--gold:#E71A27;--red:#E71A27;--line:#f0d4d4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1011;--card:#2a1a1c;--tx:#fff;--mut:#c4abad;--gold:#ff4b55;--line:#4a2a2d}}
:root[data-theme="dark"]{--bg:#1a1011;--card:#2a1a1c;--tx:#fff;--mut:#c4abad;--gold:#ff4b55;--line:#4a2a2d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:clamp(26px,6vw,38px);font-weight:900;margin:0 0 30px;text-align:center;letter-spacing:-.02em}
h1 span{color:var(--gold)}h1::after{content:'';display:block;width:64px;height:5px;margin:12px auto 0;border-radius:3px;background:#E71A27}
.sub{text-align:center;color:var(--mut);margin:6px 0 26px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px}
.slot{display:flex;flex-direction:column;align-items:center;gap:8px}
.ticket{width:100%;aspect-ratio:2/3;perspective:900px;position:relative;cursor:pointer}
.inner{position:absolute;inset:0;transition:transform .6s;transform-style:preserve-3d}
.ticket.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.front{background:var(--card);border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--mut)}
.front img{width:100%;height:100%;object-fit:cover;display:block}
.back{background:#fff;color:#111;transform:rotateY(180deg);padding:10px 9px;display:flex;flex-direction:column;border:1px solid #ddd}
.back .rule{border-top:1.5px solid #E71A27;margin:4px 0}
.back b{font-size:clamp(11px,2.8vw,15px);line-height:1.25;word-break:keep-all}
.back i{font-style:normal;font-size:clamp(8px,2vw,10px);color:#555;line-height:1.3;word-break:break-word}
.back .dt{margin-top:6px;font-size:clamp(9px,2.3vw,12px);font-weight:700}
.back .ft{margin-top:auto;color:#E71A27;text-align:center;font-size:clamp(8px,2.2vw,11px);font-weight:900;letter-spacing:.08em}
.back .ft small{display:block;font-weight:400;font-size:.8em;color:#888;letter-spacing:0}
.edit{position:absolute;top:5px;right:5px;z-index:3;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;cursor:pointer;display:none}
.slot.has .edit{display:block}
.lab{font-size:clamp(11px,2.9vw,14px);font-weight:700;text-align:center;word-break:keep-all}
.btn{display:block;margin:30px auto 0;width:100%;max-width:420px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#E71A27,#F7941D);color:#fff;font:900 17px 'Noto Sans KR',sans-serif;cursor:pointer}
.btn:disabled{opacity:.5}
section{margin-top:54px}
h2{font-size:20px;margin:0 0 4px}
.hint{color:var(--mut);font-size:13px;margin:0 0 14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:500 13px 'Noto Sans KR',sans-serif;cursor:pointer}
.chip.on{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700}
.rank{list-style:none;margin:10px 0 0;padding:0}
.rank li{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;background:var(--card);border-radius:12px;border:1px solid var(--line)}
.rank .n{font-size:22px;font-weight:900;color:#F7941D;width:28px;text-align:center}
.rank .t{flex:1;font-weight:700}.rank .t small{display:block;color:var(--mut);font-weight:400}
.rank .c{font-size:13px;color:var(--mut)}
.empty{color:var(--mut);padding:18px;text-align:center;background:var(--card);border-radius:12px;font-size:14px}
.cm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.cm small{color:var(--mut)}.cm p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
input,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:400 15px 'Noto Sans KR',sans-serif;margin-bottom:8px}
.row{display:flex;gap:8px}.row input{margin:0}
.send{padding:11px 18px;border:0;border-radius:10px;background:var(--gold);color:#fff;font:700 14px 'Noto Sans KR',sans-serif;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.show{display:flex}
.md{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.md h3{margin:0 0 12px}.md label{font-size:12px;color:var(--mut)}
.md .ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.md img.pv{width:100%;border-radius:10px}
.naver{display:block;text-align:center;padding:11px;border-radius:10px;background:#03c75a;color:#fff;font-weight:700;text-decoration:none;margin-bottom:12px;font-size:14px}
.btn[hidden],.banner[hidden]{display:none}
.btn.alt{margin-top:10px;background:var(--card);color:var(--gold);border:2px solid var(--gold)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid #E71A27;border-radius:12px;padding:12px 14px;margin-bottom:18px;font-weight:700;font-size:14px}
.back .rv{margin-top:6px;font-size:clamp(8px,2.1vw,11px);color:#333;line-height:1.35;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
body.vm .edit{display:none!important}
.sg{display:flex;flex-direction:column;gap:4px;margin:-4px 0 10px}
.sgi{text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:400 14px 'Noto Sans KR',sans-serif;cursor:pointer}
.sgi small{display:block;color:var(--mut)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
<h1>나의 <span>영화</span> 포토티켓</h1>
<div class="banner" id="banner" hidden><span>공유받은 영화 포토티켓이에요 🎬</span><button class="send" id="mine">나도 만들어보기</button></div>
<div class="grid" id="grid"></div>
<button class="btn" id="save">이미지로 저장하기</button>
<button class="btn alt" id="share">링크로 공유하기</button>

<section>
<h2>🏆 주제별 인기 영화</h2>
<p class="hint">다른 사람들이 가장 많이 고른 영화예요. 내 선택은 자동으로 반영돼요.</p>
<div class="chips" id="chips"></div>
<ol class="rank" id="rank"></ol>
</section>

<section>
<h2>💬 의견 나누기</h2>
<p class="hint" id="cmhint">순위를 보고 하고 싶은 이야기를 남겨보세요.</p>
<div id="cmform">
<input id="nick" placeholder="닉네임 (선택)" maxlength="16">
<div class="row"><input id="ctext" placeholder="이 순위, 어떻게 생각하세요?" maxlength="300"><button class="send" id="csend">등록</button></div>
</div>
<div id="cms" style="margin-top:14px"></div>
</section>
<p id="visits" style="text-align:center;color:var(--mut);margin-top:40px;font-size:13px"></p>
</main>

<div class="ov" id="ov"><div class="md" id="md"></div></div>

<script>
const T=['최애 영화','인생 영화','과몰입 영화','영업하고 싶은 영화','나만 본 영화','나만 안 본 영화','나랑 안 맞는 영화','뜻밖의 발견인 영화','최근에 본 영화'];
const D=['일','월','화','수','목','금','토'];
const picks=Array(9).fill(null);
const MOVIES=[["왕과 사는 남자","The King's Warden","2026-02-04"],["프로젝트 헤일메리","Project Hail Mary","2026-03-18"],["살목지","","2026-04-08"],["남편들","Husbands in Action","2026-06-19"],["호프","Hope","2026-07-15"],["극장판 치이카와: 인어 섬의 비밀","","2026-09-30"],["암살자(들)","","2026-09-23"],["타짜: 벨제붑의 노래","","2026-09-23"],["룩백","Look Back","2026-10-08"],["여전히 찬란하게","","2026-10-21"],["최종면접","","2026-11-04"],["극장판 마법소녀 마도카☆마기카〈발푸르기스의 회천〉","","2026-11-04"],["와일드 호스 나인","","2026-11-04"],["명탐정 코난: 30호 살인 사건","","2026-11-05"],["폴2: 데드포인트","","2026-11-11"],["폭설","","2026-11-18"],["명량","The Admiral: Roaring Currents","2014-07-30"],["극한직업","Extreme Job","2019-01-23"],["신과함께-죄와 벌","Along with the Gods: The Two Worlds","2017-12-20"],["국제시장","Ode to My Father","2014-12-17"],["어벤져스: 엔드게임","Avengers: Endgame","2019-04-24"],["겨울왕국 2","Frozen II","2019-11-21"],["아바타","Avatar","2009-12-17"],["베테랑","Veteran","2015-08-05"],["괴물","The Host","2006-07-27"],["도둑들","The Thieves","2012-07-25"],["7번방의 선물","Miracle in Cell No. 7","2013-01-23"],["알라딘","Aladdin","2019-05-23"],["암살","Assassination","2015-07-22"],["범죄도시 2","The Roundup","2022-05-18"],["광해, 왕이 된 남자","Masquerade","2012-09-13"],["서울의 봄","12.12: The Day","2023-11-22"],["왕의 남자","The King and the Clown","2005-12-29"],["신과함께-인과 연","Along with the Gods: The Last 49 Days","2018-08-01"],["택시운전사","A Taxi Driver","2017-08-02"],["태극기 휘날리며","Taegukgi: The Brotherhood of War","2004-02-05"],["부산행","Train to Busan","2016-07-20"],["해운대","Haeundae","2009-07-22"],["변호인","The Attorney","2013-12-18"],["어벤져스: 인피니티 워","Avengers: Infinity War","2018-04-25"],["실미도","Silmido","2003-12-24"],["어벤져스: 에이지 오브 울트론","Avengers: Age of Ultron","2015-04-23"],["인터스텔라","Interstellar","2014-11-06"],["기생충","Parasite","2019-05-30"],["겨울왕국","Frozen","2014-01-16"],["아바타: 물의 길","Avatar: The Way of Water","2022-12-14"],["범죄도시 3","The Roundup: No Way Out","2023-05-31"]];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=v=>{if(!v)return'';const d=new Date(v+'T00:00:00');return isNaN(d)?'':`${v.replace(/-/g,'.')} (${D[d.getDay()]})`};

function render(){
  $('grid').innerHTML=T.map((t,i)=>{
    const p=picks[i];
    return `<div class="slot ${p?'has':''}"><div class="ticket" data-i="${i}">
      <button class="edit" data-e="${i}" aria-label="수정">✎</button>
      <div class="inner"><div class="face front">${p?`<img src="${p.img}" alt="">`:'+'}</div>
      <div class="face back">${p?`<div class="rule"></div><b>${esc(p.t)}</b><i>${esc(p.e)}</i><div class="rule"></div><div class="dt">${esc(fmtDate(p.d))}</div>${p.r?`<div class="rv">“${esc(p.r)}”</div>`:''}<div class="ft">PHOTO TICKET<small>${esc(T[i])}</small></div>`:''}</div></div></div>
      <div class="lab">${t}</div></div>`}).join('');
}
$('grid').addEventListener('click',e=>{
  const eb=e.target.closest('[data-e]');if(eb){if(!document.body.classList.contains('vm'))openEd(+eb.dataset.e);return}
  const tk=e.target.closest('.ticket');if(!tk)return;
  const i=+tk.dataset.i;
  if(!picks[i]){if(!document.body.classList.contains('vm'))openEd(i)}else tk.classList.toggle('flip');
});

function openEd(i){
  const p=picks[i]||{};let img=p.img||'';
  $('md').innerHTML=`<h3>${T[i]}</h3>
  <a class="naver" id="nv" target="_blank" rel="noopener" href="https://search.naver.com/search.naver?query=영화">네이버에서 영화 검색하기 ↗</a>
  <label>영화 검색 (목록에서 고르면 제목·개봉일이 자동 입력돼요)</label><input id="q" placeholder="예: 기생충, Parasite" autocomplete="off"><div class="sg" id="sg"></div>
  <label>한글 제목</label><input id="kt" value="${esc(p.t)}">
  <label>영어 제목</label><input id="et" value="${esc(p.e)}">
  <label>개봉일 (선택)</label><input id="dt" type="date" value="${esc(p.d)}">
  <label>한줄평 (선택, 40자)</label><input id="rv" maxlength="40" placeholder="이 영화를 한 줄로 말한다면?" value="${esc(p.r)}">
  <label>포스터 이미지 (네이버 검색 결과 이미지를 저장해 올려주세요)</label>
  <input id="fl" type="file" accept="image/*"><img class="pv" id="pv" ${img?`src="${img}"`:'hidden'}>
  <div class="row" style="margin-top:12px"><button class="send ghost" id="cn">취소</button>${p.t?'<button class="send ghost" id="rm">삭제</button>':''}<button class="send" id="ok" style="flex:1">완료</button></div>`;
  $('ov').classList.add('show');
  const upd=()=>{$('nv').href='https://search.naver.com/search.naver?query='+encodeURIComponent('영화 '+($('q').value||$('kt').value||''))};
  $('q').oninput=()=>{upd();const v=key($('q').value);$('sg').innerHTML=v?MOVIES.filter(m=>key(m[0]+m[1]).includes(v)).slice(0,6).map(m=>`<button type="button" class="sgi" data-k="${MOVIES.indexOf(m)}"><b>${esc(m[0])}</b><small>${esc(m[1]?m[1]+' · ':'')}${esc(m[2].replace(/-/g,'.'))}</small></button>`).join(''):''};
  $('sg').onclick=e=>{const b=e.target.closest('.sgi');if(!b)return;const m=MOVIES[+b.dataset.k];$('kt').value=m[0];$('et').value=m[1];$('dt').value=m[2];$('q').value=m[0];$('sg').innerHTML='';upd()};
  $('fl').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const w=360,h=Math.round(im.height*w/im.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);img=c.toDataURL('image/jpeg',.78);$('pv').src=img;$('pv').hidden=false};im.src=r.result};r.readAsDataURL(f)};
  $('cn').onclick=close;
  if($('rm'))$('rm').onclick=()=>{picks[i]=null;close();render();sync()};
  $('ok').onclick=()=>{
    const t=$('kt').value.trim();
    if(!t||!img){alert('한글 제목과 포스터 이미지를 넣어주세요.');return}
    picks[i]={t,e:$('et').value.trim(),d:$('dt').value,r:$('rv').value.trim(),img};close();render();sync();
  };
}
function close(){$('ov').classList.remove('show')}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')close()});

/* ---------- 이미지 저장 ---------- */
const rr=(c,x,y,w,h,r)=>{c.beginPath();c.roundRect(x,y,w,h,r)};
const loadImg=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s});
function fit(c,s,x,y,w,lh,max){let L=[],cur='';for(const ch of s){if(c.measureText(cur+ch).width>w){L.push(cur);cur=ch}else cur+=ch}L.push(cur);L.slice(0,max).forEach((l,k)=>c.fillText(l,x,y+k*lh))}
async function makeImage(){
  await document.fonts.load('900 60px "Noto Sans KR"');await document.fonts.load('400 20px "Noto Sans KR"');
  const W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#ffffff');g.addColorStop(.6,'#fffaf8');g.addColorStop(1,'#fff0ec');x.fillStyle=g;x.fillRect(0,0,W,H);
  const gl=x.createRadialGradient(W/2,0,0,W/2,0,700);gl.addColorStop(0,'rgba(231,26,39,.10)');gl.addColorStop(1,'rgba(231,26,39,0)');
  x.fillStyle=gl;x.fillRect(0,0,W,900);x.fillStyle='#E71A27';x.fillRect(0,0,W,14);x.fillRect(0,H-14,W,14);
  x.textAlign='center';x.fillStyle='#E71A27';x.font='700 26px "Noto Sans KR"';x.fillText('★  MY MOVIE PHOTO TICKET  ★',W/2,100);
  x.fillStyle='#231f20';x.font='900 76px "Noto Sans KR"';x.fillText('나의 영화 포토티켓',W/2,190);
  const cw=300,ch=370,gap=30,m=(W-cw*3-gap*2)/2;
  const imgs=await Promise.all(picks.map(p=>p&&p.img?loadImg(p.img):null));
  for(let i=0;i<9;i++){
    const cx=m+(i%3)*(cw+gap),cy=290+Math.floor(i/3)*530;
    if(imgs[i]){x.save();x.shadowColor='rgba(0,0,0,.25)';x.shadowBlur=26;x.shadowOffsetY=10;x.fillStyle='#fff';rr(x,cx,cy,cw,ch,14);x.fill();x.restore()}
    x.save();rr(x,cx,cy,cw,ch,14);x.clip();
    if(imgs[i]){const im=imgs[i],s=Math.max(cw/im.width,ch/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,cx+(cw-w)/2,cy+(ch-h)/2,w,h)}
    else{x.fillStyle='rgba(231,26,39,.05)';x.fillRect(cx,cy,cw,ch)}
    x.restore();
    x.strokeStyle=imgs[i]?'rgba(0,0,0,.12)':'rgba(231,26,39,.4)';x.lineWidth=2;if(!imgs[i])x.setLineDash([10,8]);rr(x,cx,cy,cw,ch,14);x.stroke();x.setLineDash([]);
    x.fillStyle='#E71A27';x.font='700 26px "Noto Sans KR"';x.textAlign='center';x.fillText(T[i],cx+cw/2,cy-20);
    const p=picks[i];
    if(p){x.fillStyle='#231f20';x.font='500 22px "Noto Sans KR"';let tt=p.t;while(x.measureText(tt).width>cw-10&&tt.length>1)tt=tt.slice(0,-1);if(tt!==p.t)tt=tt.slice(0,-1)+'…';x.fillText(tt,cx+cw/2,cy+ch+36);
      if(p.r){x.fillStyle='rgba(35,31,32,.6)';x.font='400 20px "Noto Sans KR"';fit(x,'“'+p.r+'”',cx+cw/2,cy+ch+64,cw,24,2)}}
  }
  return new Promise(r=>c.toBlob(r,'image/png'));
}
$('save').onclick=async()=>{
  if(!picks.some(Boolean)){alert('먼저 영화를 1개 이상 골라주세요.');return}
  $('save').disabled=true;$('save').textContent='이미지 만드는 중…';
  try{
    const blob=await makeImage();const url=URL.createObjectURL(blob);
    $('md').innerHTML=`<h3>저장할 이미지</h3><img class="pv" src="${url}" alt=""><p class="hint" style="margin-top:10px">버튼이 안 되면 이미지를 길게 눌러 저장하세요.</p><div class="row"><button class="send ghost" id="cn">닫기</button><button class="send" id="dl" style="flex:1">PNG 다운로드</button></div>`;

  }finally{$('save').disabled=false;$('save').textContent='이미지로 저장하기'}
};

/* ---------- 순위 & 의견 (공유 DB) ---------- */
let db=null,uid=null,votes=[],cur=0,timer;
const key=s=>s.toLowerCase().replace(/\s+/g,'');
function renderChips(){$('chips').innerHTML=T.map((t,i)=>`<button class="chip ${i===cur?'on':''}" data-c="${i}">${t}</button>`).join('')}
$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){cur=+b.dataset.c;renderChips();renderRank()}});
function renderRank(){
  const m={};
  votes.forEach(v=>{const p=v.picks&&v.picks[cur];if(!p||!p.t)return;const k=key(p.t);(m[k]=m[k]||{t:p.t,e:p.e,n:0}).n++});
  const a=Object.values(m).sort((x,y)=>y.n-x.n).slice(0,5);
  $('rank').innerHTML=a.length?a.map((r,i)=>`<li><span class="n">${i+1}</span><span class="t">${esc(r.t)}<small>${esc(r.e)}</small></span><span class="c">${r.n}명</span></li>`).join(''):`<div class="empty">아직 “${T[cur]}”를 고른 사람이 없어요. 첫 번째가 되어보세요!</div>`;
}
function sync(){
  if(!db||!uid||document.body.classList.contains('vm'))return;clearTimeout(timer);
  timer=setTimeout(()=>{const o={};picks.forEach((p,i)=>{if(p)o[i]={t:p.t,e:p.e}});db.collection('votes').doc(uid).set({picks:o}).catch(()=>{});db.collection('mine').doc(uid).set({picks}).catch(()=>{})},800);
}
$('csend').onclick=async()=>{
  const text=$('ctext').value.trim();if(!text||!db)return;
  try{await db.collection('comments').doc('c'+Date.now()+Math.random().toString(36).slice(2,6)).set({text,name:$('nick').value.trim()||'익명',ts:Date.now(),topic:T[cur]});$('ctext').value=''}catch(e){alert('의견을 등록할 수 없어요. (로그인이 필요할 수 있어요)')}
};
const SUPABASE_URL='https://jtfcaxuxfniccklapana.supabase.co';          // 예: https://abcd1234.supabase.co
const SUPABASE_KEY='sb_publishable_NJzkqxejtZaM8ONv3HuWeA_hK2aMfUX';      // sb_publishable_... (secret 키 금지)
function makeDb(sb,uid){
  const coll=name=>({
    doc:id=>({
      async set(data){const {error}=await sb.from('docs').upsert({collection:name,id,owner:uid,data},{onConflict:'collection,id'});if(error)throw error},
      async get(){const {data}=await sb.from('docs').select('data').eq('collection',name).eq('id',id).maybeSingle();return {exists:!!data,data:()=>data&&data.data}}
    }),
    onSnapshot(cb,err){
      const run=async()=>{try{const {data,error}=await sb.from('docs').select('id,data').eq('collection',name).order('created_at',{ascending:false}).limit(500);if(error)throw error;cb({docs:data.map(r=>({id:r.id,data:()=>r.data}))})}catch(e){err&&err(e)}};
      run();const t=setInterval(run,15000);return()=>clearInterval(t)
    }
  });
  return {collection:coll};
}
const BASE=location.origin+location.pathname;
async function route(){
  const m=location.hash.match(/^#s-([a-z0-9]+)$/),b=document.body.classList;
  if(!m){if(b.contains('vm')){b.remove('vm');$('banner').hidden=true;$('share').hidden=false;location.reload()}return}
  if(!db){alert('공유 링크는 로그인 후 볼 수 있어요.');return}
  try{
    const s=await db.collection('shares').doc(m[1]).get();
    if(!s.exists){alert('공유된 포토티켓을 찾을 수 없어요.');return}
    const d=s.data().picks||{};picks.fill(null);
    await Promise.all(Object.keys(d).map(async k=>{const ps=await db.collection('posters').doc(m[1]+'_'+k).get();picks[+k]={...d[k],img:ps.exists?ps.data().img:''}}));
    b.add('vm');$('banner').hidden=false;$('share').hidden=true;render();window.scrollTo(0,0);
  }catch(e){alert('불러오지 못했어요. 로그인 상태를 확인해 주세요.')}
}
window.addEventListener('hashchange',route);
$('mine').onclick=()=>{location.hash='';route()};
$('share').onclick=async()=>{
  if(!picks.some(Boolean)){alert('먼저 영화를 1개 이상 골라주세요.');return}
  if(!db){alert('링크 공유는 로그인 후 사용할 수 있어요.');return}
  $('share').disabled=true;$('share').textContent='링크 만드는 중…';
  try{
    const id=Math.random().toString(36).slice(2,10),o={};
    await Promise.all(picks.map((p,i)=>{if(!p)return;o[i]={t:p.t,e:p.e,d:p.d||'',r:p.r||''};return db.collection('posters').doc(id+'_'+i).set({img:p.img})}));
    await db.collection('shares').doc(id).set({picks:o,ts:Date.now()});
    const url=BASE+'#s-'+id;
    $('md').innerHTML=`<h3>공유 링크가 만들어졌어요 🎉</h3><input id="lk" readonly value="${url}"><p class="hint">링크를 받은 사람은 누구나 내 포토티켓을 볼 수 있어요.</p><div class="row"><button class="send ghost" id="cn">닫기</button><button class="send" id="cp" style="flex:1">링크 복사</button></div>`;
    $('ov').classList.add('show');$('cn').onclick=close;
    $('cp').onclick=async()=>{try{await navigator.clipboard.writeText(url)}catch(e){$('lk').select();document.execCommand('copy')}$('cp').textContent='복사됐어요 ✓'};
  }catch(e){alert('링크를 만들지 못했어요. 이 페이지에 참여(편집) 권한이 있는지 확인해 주세요.')}
  finally{$('share').disabled=false;$('share').textContent='링크로 공유하기'}
};

  $('cms').innerHTML='<div class="empty">불러오는 중…</div>';

    db.collection('votes').onSnapshot(s=>{votes=s.docs.map(d=>d.data());renderRank()},()=>{});
    db.collection('comments').onSnapshot(s=>{
      const a=s.docs.map(d=>d.data()).sort((x,y)=>y.ts-x.ts).slice(0,50);
      $('cms').innerHTML=a.length?a.map(c=>`<div class="cm"><small>${esc(c.name)} · ${esc(c.topic||'')} · ${new Date(c.ts).toLocaleDateString('ko-KR')}</small><p>${esc(c.text)}</p></div>`).join(''):'<div class="empty">첫 의견을 남겨보세요 ✍️</div>'
    },()=>{});
    sync();route();
  }catch(e){$('cms').innerHTML='<div class="empty">서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.</div>';$('cmform').style.display='none'}
})();
